<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pit Tyre Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0A0C0F;
    --surface:#14171C;
    --surface-2:#1C2027;
    --border:#2A2F38;
    --text:#F2F3F1;
    --text-dim:#8B93A1;
    --amber:#FFB300;
    --amber-dim:#5C4310;
    --green:#25D673;
    --green-dim:#0E3A22;
    --red:#FF4D4D;
    --red-dim:#3A1414;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;
    padding-bottom:84px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.app-header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(10,12,15,0.97), rgba(10,12,15,0.9));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 16px 10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand .stripe{width:6px;height:26px;background:var(--amber);border-radius:2px;}
  .brand h1{
    font-size:19px; font-weight:700; letter-spacing:0.5px; margin:0;
    text-transform:uppercase;
  }
  .brand .sub{
    font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;
    letter-spacing:1px; text-transform:uppercase; margin-top:1px;
  }
  main{padding:14px 14px 20px; max-width:640px; margin:0 auto;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:13px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--text-dim); margin:0 0 12px; font-weight:600;
  }
  .row{display:flex; gap:8px;}
  .field{flex:1; min-width:0;}
  label{
    display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:0.8px; margin-bottom:6px; font-weight:600;
  }
  select, input[type=text], input[type=number]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 10px;
    font-family:'Rajdhani',sans-serif;
    font-size:16px;
    font-weight:600;
    appearance:none;
  }
  select:focus, input:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .pos-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;
  }
  .pos-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:14px 8px;
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    font-weight:700;
    text-align:center;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .pos-btn.active{
    background:var(--amber-dim);
    border-color:var(--amber);
    color:var(--amber);
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--amber);
    color:#1A1200;
    border:none;
    border-radius:12px;
    padding:16px;
    font-family:'Rajdhani',sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .btn:active{transform:scale(0.98);}
  .btn.secondary{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn.ghost{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--border);
    text-transform:none;
    font-weight:600;
    font-size:14px;
    padding:10px;
  }
  .btn:disabled{opacity:0.4;}
  .btn-delete{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:6px 9px;font-family:'Rajdhani',sans-serif;font-weight:700;cursor:pointer;white-space:nowrap;}
  .btn-delete:active{transform:scale(0.97);}

  /* result panel */
  .result{
    border-radius:var(--radius);
    padding:20px 16px;
    text-align:center;
    margin-bottom:14px;
    border:1px solid var(--border);
  }
  .result.ok{background:var(--green-dim); border-color:var(--green);}
  .result.bad{background:var(--red-dim); border-color:var(--red);}
  .result.warn{background:var(--surface-2); border-color:var(--amber);}
  .result .verdict{
    font-size:28px; font-weight:700; letter-spacing:0.5px; margin-bottom:4px;
  }
  .result.ok .verdict{color:var(--green);}
  .result.bad .verdict{color:var(--red);}
  .result.warn .verdict{color:var(--amber);}
  .result .detail{font-size:14px; color:var(--text-dim);}
  .stat-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;
  }
  .stat{
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    padding:10px 6px;
  }
  .stat .val{font-size:20px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .stat .lbl{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin-top:2px;}

  /* nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    padding:10px 4px 8px; font-family:'Rajdhani',sans-serif;
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer;
  }
  nav.tabbar button.active{color:var(--amber);}
  nav.tabbar svg{width:20px;height:20px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{
    padding:8px 6px; text-align:left; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  th{
    color:var(--text-dim); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;
    font-weight:600;
  }
  .tbl-wrap{overflow-x:auto; margin:0 -16px; padding:0 16px;}
  .pill{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
    font-weight:700; font-family:'IBM Plex Mono',monospace;
  }
  .pill.used{background:var(--surface-2); color:var(--text-dim);}
  .pill.new{background:var(--green-dim); color:var(--green);}

  /* scanner overlay */
  .scan-overlay{
    position:fixed; inset:0; background:#000; z-index:100;
    display:flex; flex-direction:column;
  }
  .scan-overlay video{
    flex:1; width:100%; object-fit:cover; background:#000;
  }
  .scan-frame{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:78%; max-width:320px; aspect-ratio:2/1;
    border:3px solid var(--amber); border-radius:14px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.45);
  }
  .scan-top{
    position:absolute; top:0; left:0; right:0; padding:16px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:2;
  }
  .scan-top .close-btn{
    background:rgba(255,255,255,0.12); border:none; color:#fff;
    width:38px; height:38px; border-radius:50%; font-size:18px;
    cursor:pointer;
  }
  .scan-hint{
    position:absolute; bottom:110px; left:0; right:0; text-align:center;
    color:#fff; font-size:14px; font-weight:600; z-index:2; padding:0 20px;
  }
  .manual-entry{
    position:absolute; bottom:0; left:0; right:0; padding:16px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.85) 40%);
    z-index:2; display:flex; gap:8px;
  }
  .manual-entry input{flex:1;}
  .manual-entry button{
    background:var(--amber); border:none; color:#1A1200; border-radius:10px;
    padding:0 16px; font-weight:700; font-family:'Rajdhani',sans-serif; font-size:15px;
  }
  .toast{
    position:fixed; bottom:96px; left:16px; right:16px; z-index:200;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:12px 16px; border-radius:10px; font-size:14px;
    text-align:center;
  }
  .empty{
    text-align:center; color:var(--text-dim); font-size:14px; padding:24px 10px;
  }
  .log-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-row .meta{color:var(--text-dim); font-size:11px; margin-top:2px;}
  .badge-ok{color:var(--green); font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .badge-bad{color:var(--red); font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
    margin:18px 0 8px; font-weight:700;
  }
  .inline-edit{width:70px; padding:6px 4px; font-size:13px; text-align:center;}
  .save-bar{
    position:sticky; bottom:0; padding-top:10px;
  }
  .hidden{display:none !important;}

/* --- MOBILE: Google Drive sync compacto (solo visual) --- */
@media (max-width: 700px) {
  #driveSyncPanel {
    top: calc(10px + env(safe-area-inset-top)) !important;
    right: 10px !important;
    bottom: auto !important;
    width: 44px !important;
    height: 44px !important;
    padding: 0 !important;
    border-radius: 12px !important;
    overflow: hidden !important;
    background: #14171C !important;
    border: 1px solid #2A2F38 !important;
    box-shadow: 0 4px 14px rgba(0,0,0,.28) !important;
  }

  #driveSyncPanel > div {
    display: none !important;
  }

  #driveSyncPanel #btnDriveConnect {
    display: none !important;
  }

  #driveSyncPanel #btnDriveSync {
    display: block !important;
    width: 44px !important;
    height: 44px !important;
    min-width: 44px !important;
    padding: 0 !important;
    margin: 0 !important;
    border: 0 !important;
    border-radius: 11px !important;
    background: #FFB300 !important;
    color: #1A1200 !important;
    font-size: 0 !important;
    line-height: 44px !important;
    text-align: center !important;
    cursor: pointer !important;
  }

  #driveSyncPanel #btnDriveSync::after {
    content: "🔄";
    font-size: 20px;
    line-height: 44px;
  }
}

</style>
</head>

// ---------- storage helpers ----------
async function storeGet(key, shared){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, !!shared);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('storage get failed', key, e);
    return null;
  }
}

    const json = JSON.stringify(value);
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, json, !!shared);
    } else {
      localStorage.setItem(key, json);
    }
    if(['inventory-37','inventory-85','plan-37','plan-85','scan-log'].includes(key)){
      localStorage.setItem('pit-local-dirty-at', new Date().toISOString());
    }
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    return false;
  }
}

// ---------- lookups ----------
function normCode(v){
  return String(v ?? '').trim().toUpperCase();
}
function findTyreByCode(car, code){
  const c = normCode(code);
  if(!c) return null;
  return (state.inventory[car]||[]).find(t =>
    normCode(t.code) === c || normCode(t.own_code) === c
  ) || null;
}
function findTyreBySet(car, set){
  return (state.inventory[car]||[]).find(t => String(t.set) === String(set)) || null;
}
function findTyreByOwnCode(car, ownCode){
  const c = normCode(ownCode);
  if(!c) return null;
  return (state.inventory[car]||[]).find(t => normCode(t.own_code) === c) || null;
}

async function promptManualCode(){
  const code = prompt('Código del neumático (código de barras):');
  if(code) await processScan(code);
}

async function processScan(code){
  const {car, session, position} = state.scan;
  // 1) Busca el neumático en el inventario por su columna CODE (código de fábrica / de barras).
  const tyre = findTyreByCode(car, code);
  const planEntry = (state.plan[car][session]||{})[position] || {};
  let result;

  if(!tyre){
    result = {
      type:'warn',
      title:'CÓDIGO NO ENCONTRADO',
      detail:`El código "${code}" no está en el inventario del auto #${car}.`,
      scannedOwnCode:'—', expectedOwnCode: planEntry.own_code ?? '—', pressure: planEntry.start_bar ?? '—',
    };
  } else if(!planEntry.own_code){
    result = {
      type:'warn',
      title:'SIN PLAN CARGADO',
      detail:`No hay un neumático planificado para Auto ${car} / ${session} / ${position}. Cargalo en la pestaña Plan.`,
      scannedOwnCode: tyre.own_code, expectedOwnCode:'—', pressure:'—',
    };
  // 2) Compara el OWN CODE del neumático encontrado contra el OWN CODE guardado en el plan de esa sesión.
  } else if(normCode(tyre.own_code) === normCode(planEntry.own_code)){
    result = {
      type:'ok',
      detail:`${tyre.own_code} es el correcto para esta posición.`,
      scannedOwnCode: tyre.own_code, expectedOwnCode: planEntry.own_code, pressure: planEntry.start_bar,
    };
  } else {
    result = {
      type:'bad',
      detail:`Escaneaste ${tyre.own_code}, pero acá va ${planEntry.own_code}.`,
      scannedOwnCode: tyre.own_code, expectedOwnCode: planEntry.own_code, pressure: planEntry.start_bar,
    };
  }

  state.lastResult = result;
  const entry = {
    ts: Date.now(),
    car, session, position,
    code: String(code),
    scannedOwnCode: result.scannedOwnCode,
    expectedOwnCode: result.expectedOwnCode,
    outcome: result.type,
  };
  state.log = [entry, ...state.log].slice(0, 300);
  await storeSet('scan-log', state.log, true);

  renderScanTab();
}

          if(codes && codes.length){
            const value = codes[0].rawValue;
            closeScanner();
            await processScan(value);
            return;
          }
        }catch(e){ /* ignore per-frame errors */ }
        scannerLoopId = requestAnimationFrame(loop);
      };
      scannerLoopId = requestAnimationFrame(loop);
    }catch(e){
      document.getElementById('scanHint').textContent = 'Escaneo automático no disponible en este navegador. Escribí el código.';
    }
  }else{
    document.getElementById('scanHint').textContent = 'Este navegador no soporta lectura automática. Escribí el código.';
  }

function closeScanner(){
  if(scannerLoopId) cancelAnimationFrame(scannerLoopId);
  scannerLoopId = null;
  if(scannerStream){
    scannerStream.getTracks().forEach(t=>t.stop());
    scannerStream = null;
  }
  const overlay = document.getElementById('scanOverlay');
  if(overlay) overlay.remove();
}

// ---------- IMPORT FROM EXCEL — V1.3 MULTI-AUTO ----------
// Estructura esperada por hoja de sesión (Test 1, FP1, Q1, R1, etc.):
// una celda con "TYRES ON CAR" marca el inicio del bloque; a partir de ahí,
// offsets fijos ubican FL/FR (código propio + presión) y RL/RR (ídem).
function findHeaderRowIndex(matrix){
  for(let r=0; r<matrix.length; r++){
    const row = matrix[r] || [];
    for(let c=0; c<row.length; c++){
      if(typeof row[c] === 'string' && row[c].toUpperCase().includes('TYRES ON CAR')) return r;
    }
  }
  return -1;
}
function cellAt(matrix, r, c){
  const row = matrix[r];
  if(!row) return undefined;
  const v = row[c];
  return v === undefined ? undefined : v;
}
function parseSessionSheet(matrix){
  const h = findHeaderRowIndex(matrix);
  if(h < 0) return null;
  const carFL = cellAt(matrix, h+4, 2);
  const carFR = cellAt(matrix, h+4, 17);
  const car = normCode(carFL || carFR);
  if(!car) return null;

  const flOwn = cellAt(matrix, h+8, 0);
  const flBar = cellAt(matrix, h+4, 7);
  const frOwn = cellAt(matrix, h+8, 10);
  const frBar = cellAt(matrix, h+4, 12);
  const rlOwn = cellAt(matrix, h+16, 0);
  const rlBar = cellAt(matrix, h+12, 7);
  const rrOwn = cellAt(matrix, h+16, 10);
  const rrBar = cellAt(matrix, h+12, 12);

  return {
    car,
    entries: {
      FL: { own_code: flOwn ?? null, start_bar: (typeof flBar==='number' ? flBar : null) },
      FR: { own_code: frOwn ?? null, start_bar: (typeof frBar==='number' ? frBar : null) },
      RL: { own_code: rlOwn ?? null, start_bar: (typeof rlBar==='number' ? rlBar : null) },
      RR: { own_code: rrOwn ?? null, start_bar: (typeof rrBar==='number' ? rrBar : null) },
    }
  };
}

function normSheetName(v){
  return String(v ?? '').trim().replace(/\s+/g,' ').toUpperCase();
}

async function importPlanFromExcel(file){
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });

    // Mapa normalizado para tolerar espacios finales/dobles y mayúsculas/minúsculas.
    const sheetNameMap = new Map();
    wb.SheetNames.forEach(realName=> sheetNameMap.set(normSheetName(realName), realName));

    const imported = [];
    const skipped = [];
    const touchedCars = new Set();

    // V1.3: una hoja por auto + sesión, ej. "37 FP2" y "85 FP2".
    for(const car of CARS){
      for(const sessionName of SESSIONS){
        const candidates = [
          `${car} ${sessionName}`,
          `${sessionName} ${car}`,
          `${car}-${sessionName}`,
          `${sessionName}-${car}`,
          `${car}_${sessionName}`,
          `${sessionName}_${car}`,
        ];

        let realSheetName = null;
        for(const candidate of candidates){
          const hit = sheetNameMap.get(normSheetName(candidate));
          if(hit){ realSheetName = hit; break; }
        }

        // Compatibilidad con el Excel anterior: hojas FP1, FP2, etc.
        // Solo se usa si el contenido de la hoja identifica correctamente el auto.
        if(!realSheetName){
          const legacyHit = sheetNameMap.get(normSheetName(sessionName));
          if(legacyHit) realSheetName = legacyHit;
        }

        if(!realSheetName){
          skipped.push(`${car} ${sessionName} (hoja no encontrada)`);
          continue;
        }

        const sheet = wb.Sheets[realSheetName];
        const matrix = XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval: undefined });
        const parsed = parseSessionSheet(matrix);

        if(!parsed || !CARS.includes(parsed.car)){
          skipped.push(`${realSheetName} (no se pudo leer)`);
          continue;
        }

        // Protección contra cargar por error una hoja del otro auto.
        if(parsed.car !== car){
          skipped.push(`${realSheetName} (dice Auto ${parsed.car}, esperaba ${car})`);
          continue;
        }

        if(!state.plan[car]) continue;
        if(!state.plan[car][sessionName]) state.plan[car][sessionName] = {};
        POSITIONS.forEach(pos=>{
          state.plan[car][sessionName][pos] = parsed.entries[pos];
        });

        imported.push(`${car} ${sessionName}`);
        touchedCars.add(car);
      }
    }

    for(const car of touchedCars){
      await storeSet('plan-' + car, state.plan[car], true);
    }

    let msg = `Importadas ${imported.length} sesiones`;
    if(touchedCars.size) msg += ` · Autos ${[...touchedCars].join(' y ')}`;
    if(skipped.length) msg += ` · Sin leer: ${skipped.length}`;
    toast(msg);
    console.log('Importadas:', imported);
    if(skipped.length) console.warn('Sin leer:', skipped);
    renderPlanTab();
  }catch(e){
    console.error('import error', e);
    toast('No se pudo leer el Excel. Revisá el formato del archivo.');
  }
}

    const pos = inp.dataset.pos, field = inp.dataset.field;
    if(!updated[pos]) updated[pos] = {};
    if(field === 'own_code'){
      const v = inp.value.trim();
      updated[pos][field] = v === '' ? null : v;
    } else {
      const v = inp.value === '' ? null : parseFloat(inp.value);
      updated[pos][field] = isNaN(v) ? null : v;
    }
  });
  state.plan[planSel.car][planSel.session] = updated;
  const ok = await storeSet('plan-' + planSel.car, state.plan[planSel.car], true);
  toast(ok ? 'Plan guardado ✔' : 'Error al guardar');
  renderPlanTab();
}


// ---------- EXPORT TO EXCEL ----------
function exportAllToExcel(){
  try{
    if(typeof XLSX === 'undefined'){
      toast('No está disponible el generador de Excel.');
      return;
    }

    const wb = XLSX.utils.book_new();

    // 1) Inventario combinado de ambos autos
    const inventoryRows = [];
    CARS.forEach(car=>{
      (state.inventory[car] || []).forEach(t=>{
        inventoryRows.push({
          'CAR': car,
          'SET': t.set ?? '',
          'CODE': t.code ?? '',
          'OWN CODE': t.own_code ?? '',
          'TYPE': t.type ?? '',
          'CONDITION': t.condition ?? '',
          'SIDE': t.side ?? '',
          'PRE-RACE BAR': t.pre_race_bar ?? ''
        });
      });
    });
    const wsInv = XLSX.utils.json_to_sheet(inventoryRows, {header:['CAR','SET','CODE','OWN CODE','TYPE','CONDITION','SIDE','PRE-RACE BAR']});
    wsInv['!cols'] = [
      {wch:7},{wch:7},{wch:16},{wch:16},{wch:12},{wch:12},{wch:10},{wch:14}
    ];
    XLSX.utils.book_append_sheet(wb, wsInv, 'Inventario');

    // 2) Plan por auto
    CARS.forEach(car=>{
      const rows = [];
      SESSIONS.forEach(session=>{
        POSITIONS.forEach(pos=>{
          const e = (((state.plan[car] || {})[session] || {})[pos] || {});
          const tyre = findTyreByOwnCode(car, e.own_code);
          rows.push({
            'SESSION': session,
            'POSITION': pos,
            'OWN CODE': e.own_code ?? '',
            'FACTORY CODE': tyre?.code ?? '',
            'SET': tyre?.set ?? '',
            'START BAR': e.start_bar ?? ''
          });
        });
      });
      const wsPlan = XLSX.utils.json_to_sheet(rows, {header:['SESSION','POSITION','OWN CODE','FACTORY CODE','SET','START BAR']});
      wsPlan['!cols'] = [{wch:14},{wch:11},{wch:16},{wch:16},{wch:8},{wch:12}];
      XLSX.utils.book_append_sheet(wb, wsPlan, 'Plan ' + car);
    });

    // 3) Historial completo, sin limitarlo a los 80 que se muestran en pantalla
    const logRows = (state.log || []).map(e=>({
      'DATE/TIME': new Date(e.ts).toLocaleString('es-AR'),
      'CAR': e.car ?? '',
      'SESSION': e.session ?? '',
      'POSITION': e.position ?? '',
      'SCANNED CODE': e.code ?? '',
      'SCANNED OWN CODE': e.scannedOwnCode ?? '',
      'EXPECTED OWN CODE': e.expectedOwnCode ?? '',
      'RESULT': e.outcome ?? ''
    }));
    const wsLog = XLSX.utils.json_to_sheet(logRows, {header:['DATE/TIME','CAR','SESSION','POSITION','SCANNED CODE','SCANNED OWN CODE','EXPECTED OWN CODE','RESULT']});
    wsLog['!cols'] = [{wch:22},{wch:7},{wch:14},{wch:11},{wch:16},{wch:18},{wch:20},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsLog, 'Historial');

    const now = new Date();
    const pad = n=>String(n).padStart(2,'0');

// ---------- LOAD / REGISTRATION TAB ----------
let loadSel = { car:'37', condition:'NEW', code:'' };

function getNextOwnCode(car){
  const tyres = state.inventory[car] || [];
  let bestGroup = 1;
  let maxSeqInBestGroup = 0;
  tyres.forEach(t=>{
    const m = String(t.own_code || '').trim().match(new RegExp('^' + car + '-(\\d+)-(\\d+)$', 'i'));
    if(!m) return;
    const group = parseInt(m[1],10);
    const seq = parseInt(m[2],10);
    if(group > bestGroup){ bestGroup = group; maxSeqInBestGroup = seq; }
    else if(group === bestGroup && seq > maxSeqInBestGroup){ maxSeqInBestGroup = seq; }
  });
  return `${car}-${bestGroup}-${maxSeqInBestGroup + 1}`;
}

function getNextSet(car){
  const nums = (state.inventory[car] || []).map(t=>Number(t.set)).filter(Number.isFinite);
  return nums.length ? Math.max(...nums) + 1 : 1;
}

function findTyreExactFactoryCode(car, code){
  const c = normCode(code);
  if(!c) return null;
  return (state.inventory[car] || []).find(t=>normCode(t.code) === c) || null;
}

async function saveLoadedTyre(){
  const input = document.getElementById('loadCode');
  const code = (input?.value || '').trim();
  if(!code){ toast('Ingresá o escaneá un código'); return; }
  const existing = findTyreExactFactoryCode(loadSel.car, code);

  if(loadSel.condition === 'USED'){
    if(!existing){
      toast('Goma usada no encontrada en el inventario anterior');
      renderLoadPreview();
      return;
    }
    // No se modifica código propio, set ni datos históricos.
    toast(`Usada confirmada: ${existing.own_code} ✔`);
    input.value=''; loadSel.code=''; renderLoadPreview();
    return;
  }

  if(existing){
    toast(`Ya existe como ${existing.own_code}`);
    renderLoadPreview();
    return;
  }

  const newTyre = {
    set: getNextSet(loadSel.car),
    code: code,
    own_code: getNextOwnCode(loadSel.car),
    type: 'SLICK',
    condition: 'NEW',
    side: '',
    pre_race_bar: 0
  };
  state.inventory[loadSel.car].push(newTyre);
  const ok = await storeSet('inventory-' + loadSel.car, state.inventory[loadSel.car], true);
  if(!ok){
    state.inventory[loadSel.car].pop();
    toast('Error al guardar el neumático');
    return;
  }
  toast(`Nuevo ${newTyre.own_code} guardado ✔`);
  input.value=''; loadSel.code='';
  renderLoadPreview();
}

      <input type="text" id="loadManualCode" inputmode="numeric" placeholder="o escribí el código...">
      <button id="loadManualBtn">OK</button>
    </div>`;
  document.body.appendChild(overlay);

  let stream = null, loopId = null;
  const close = ()=>{
    if(loopId) cancelAnimationFrame(loopId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    document.getElementById('loadScanOverlay')?.remove();
  };
  const accept = (value)=>{
    const v=String(value||'').trim();
    if(!v) return;
    close();
    const inp=document.getElementById('loadCode');
    if(inp){ inp.value=v; loadSel.code=v; renderLoadPreview(); }
  };
  document.getElementById('closeLoadScan').onclick=close;
  document.getElementById('loadManualBtn').onclick=()=>accept(document.getElementById('loadManualCode').value);
  document.getElementById('loadManualCode').addEventListener('keydown',e=>{ if(e.key==='Enter') accept(e.target.value); });

  (async()=>{
    const video=document.getElementById('loadScanVideo');
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      video.srcObject=stream;
    }catch(e){
      document.getElementById('loadScanHint').textContent='No se pudo acceder a la cámara. Escribí el código manualmente.';
      return;
    }
    if('BarcodeDetector' in window){
      try{
        const formats=await window.BarcodeDetector.getSupportedFormats();
        const detector=new window.BarcodeDetector({formats});
        const loop=async()=>{
          if(!document.getElementById('loadScanOverlay')) return;
          try{
            const codes=await detector.detect(video);
            if(codes?.length){ accept(codes[0].rawValue); return; }
          }catch(e){}
          loopId=requestAnimationFrame(loop);
        };
        loopId=requestAnimationFrame(loop);
      }catch(e){
        document.getElementById('loadScanHint').textContent='Lectura automática no disponible. Escribí el código.';
      }
    }else{
      document.getElementById('loadScanHint').textContent='Este navegador no soporta lectura automática. Escribí el código.';
    }
  })();
}

});

  }
}

function initGoogle(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    setTimeout(initGoogle,300);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    prompt: "",
    login_hint: "hondatcr@gmail.com",
    callback: async (resp)=>{
      if(resp.error){
        pendingSync=false;
        status("Google: "+resp.error);
        return;
      }
      accessToken = resp.access_token;
      status("Google conectado ✔", true);
      if(pendingSync){
        pendingSync=false;
        await syncNow();
      }
    }
  });
}

document.addEventListener("DOMContentLoaded", ()=>{
  const connectBtn = document.getElementById("btnDriveConnect");
  const syncBtn = document.getElementById("btnDriveSync");

  connectBtn.onclick = ()=>{};

  syncBtn.onclick = async ()=>{
    if(accessToken){
      await syncNow();
      return;
    }
    if(!tokenClient){
      status("Cargando Google...");
      return;
    }
    pendingSync=true;
    status("Conectando con Google...");
    tokenClient.requestAccessToken({prompt:"", login_hint:"hondatcr@gmail.com"});
  };
  initGoogle();
});
})();
</script>
